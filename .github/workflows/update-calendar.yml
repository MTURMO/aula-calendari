name: Actualitzar calendari AULA

on:
  schedule:
    # Miércoles (3) y jueves (4), a las 08:00 y 18:00 UTC
    # (= 10:00/20:00 en verano y 09:00/19:00 en invierno, hora de Barcelona)
    - cron: "0 8,18 * * 3,4"
  workflow_dispatch:   # botón "Run workflow" para lanzarlo a mano

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Actualizar calendario
        run: python update_calendar.py

      - name: Guardar cambios si los hay
        run: |
          if [ -n "$(git status --porcelain docs/)" ]; then
            git config user.name "calendar-bot"
            git config user.email "calendar-bot@users.noreply.github.com"
            git add docs/aula.ics
            git commit -m "Actualitza calendari AULA"
            git push
          else
            echo "Sin cambios."
          fi
